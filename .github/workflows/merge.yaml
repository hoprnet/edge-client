name: Merge
on:
  pull_request:
    types:
      - closed
    branches:
      - main
concurrency:
  group: merge-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false
jobs:
  build-library:
    name: Library ${{ matrix.architecture }}
    if: github.event.pull_request.merged == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64-linux
            runner: depot-ubuntu-24.04-8
            build_command: nix build -L .#lib-edgli-x86_64-linux
    uses: hoprnet/hopr-workflows/.github/workflows/build-library.yaml@5ef5e50e028143b53da6545c1ca92477b70f42fc # build-library-v1
    permissions:
      contents: read
    with:
      source_branch: ${{ github.event.pull_request.base.ref }}
      architecture: ${{ matrix.architecture }}
      build_command: ${{ matrix.build_command }}
      runner: ${{ matrix.runner }}
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  trigger-integration:
    name: Trigger integration test
    needs: build-library
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Fire-and-forget: run the cross-repo integration throughput test against
      # this merged edgli rev. edge-client has no first-network deploy to gate,
      # so this does not block the merge pipeline.
      - name: Dispatch integration test
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.HOPRD_TEST_DISPATCH_TOKEN }}
          repository: hoprnet/hoprd-test
          event-type: integration
          client-payload: |-
            {
              "project": "edge-client",
              "rev": "${{ github.event.pull_request.merge_commit_sha }}"
            }
  notify:
    name: Notify failure
    needs:
      - build-library
    if: ${{ always() && github.event.pull_request.merged == true && !success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify failed merge pipeline
        uses: zulip/github-actions-zulip/send-message@bd8ec52de371d139ae8313661b7d8318c19266aa # v2.0.1
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: ${{ secrets.ZULIP_EMAIL }}
          organization-url: "https://hopr.zulipchat.com"
          type: "stream"
          to: "HOPRd"
          topic: "main"
          content: |
            The merge pipeline has failed for pull request [#${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

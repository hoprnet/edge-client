name: Merge queue
# Dispatches hoprnet/hopr-integration-tests, which posts its verdict back as the `Integration throughput`
# commit status, so nothing reaches `main` without the v5 throughput + PIX suites passing against that candidate.
#
# That status is required on every PR too: `pull_request_target` posts success for PRs that do not opt in.
on:
  pull_request:
    # So applying `run-integration` starts the opt-in run.
    types: [labeled]
  # Only `not-selected` runs on it: no checkout, posts one status. See there.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}-merge-queue
  cancel-in-progress: true
env:
  STATUS_CONTEXT: Integration throughput # must match the required-check context exactly
jobs:
  # Fork PRs get a read-only token on `pull_request`, so this must be `pull_request_target`.
  # Never add `actions/checkout` here: it would run untrusted PR code with a write token.
  not-selected:
    name: Integration not selected
    if: github.event_name == 'pull_request_target'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=success -f context="${STATUS_CONTEXT}" \
            -f description="not selected; label run-integration to run it"
  # NOT named `Integration throughput`: a check run with that name would satisfy the required
  # check as soon as this job goes green, and the queue would merge without waiting for the verdict.
  integration-dispatch:
    name: Integration dispatch
    # The label EVENT, not merely the label's presence: a dispatched run is never cancelled, so
    # re-dispatching on every push piles runs onto the single integration box and starves later
    # queue entries. Re-running the opt-in means re-applying the label.
    if: >-
      (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.label.name == 'run-integration')
    runs-on: depot-ubuntu-24.04
    # Waiting to become the queue tail; the dispatch itself takes seconds.
    timeout-minutes: 350
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    env:
      REPO: hoprnet/hopr-integration-tests
    steps:
      # HEADGREEN lets the queue tail's run cover every entry ahead of it, so only the tail
      # dispatches and the rest wait. Never green before MERGED: that would merge it untested.
      - name: Wait unless this entry is the queue tail
        id: tail
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          MQ_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          [[ ${MQ_REF} =~ /pr-([0-9]+)- ]] || { echo "::error::no PR number in ${MQ_REF}" >&2; exit 1; }
          pr="${BASH_REMATCH[1]}"
          q="{repository(owner:\"${GITHUB_REPOSITORY_OWNER}\",name:\"${GITHUB_REPOSITORY#*/}\"){mergeQueue(branch:\"main\"){entries(first:100){nodes{position pullRequest{number}}}}}}"
          while :; do
            state=$(gh pr view "${pr}" -R "${GITHUB_REPOSITORY}" --json state -q .state) || { sleep 30; continue; }
            if [ "${state}" = MERGED ]; then
              echo "Merged by a later queue entry's integration run" >>"${GITHUB_STEP_SUMMARY}"
              echo "skip=true" >>"${GITHUB_OUTPUT}"
              exit 0
            fi
            queued=$(gh api graphql -f query="${q}" \
                       -q '.data.repository.mergeQueue.entries.nodes | sort_by(.position) | map(.pullRequest.number | tostring) | join(" ")') ||
              { sleep 30; continue; }
            case " ${queued} " in
              *" ${pr} ") exit 0 ;;
              *" ${pr} "*) sleep 60 ;;
              *) echo "::error::#${pr} left the merge queue" >&2; exit 1 ;;
            esac
          done
      # NOT `github.sha` on a pull_request: that is `refs/pull/N/merge`, and cargo mirrors only
      # heads and tags, so it cannot resolve there. A queue candidate is a head.
      - name: Resolve the rev to test
        id: rev
        if: steps.tail.outputs.skip != 'true'
        env:
          MQ_SHA: ${{ github.event.merge_group.head_sha }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "head_sha=${MQ_SHA:-${PR_SHA}}" >>"${GITHUB_OUTPUT}"
      - name: Mark the verdict pending
        if: steps.tail.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.rev.outputs.head_sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=pending -f context="${STATUS_CONTEXT}" \
            -f description="dispatched to ${REPO}" -f target_url="https://github.com/${REPO}/actions/workflows/integration.yaml"
      - name: Generate GitHub App token
        id: bot-token
        if: steps.tail.outputs.skip != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_HOPRNET_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_HOPRNET_BOT_PRIVATE_KEY }}
          owner: hoprnet
          repositories: hopr-integration-tests
      # A breaking change names its adapted tests PR in the description; see hopr-integration-tests README.
      - name: Find the companion tests PR
        id: companion
        if: steps.tail.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MQ_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          pr="${PR_NUMBER}"
          if [ -z "${pr}" ] && [[ ${MQ_REF} =~ /pr-([0-9]+)- ]]; then pr="${BASH_REMATCH[1]}"; fi
          tests_pr="$(gh pr view "${pr}" -R "${GITHUB_REPOSITORY}" --json body -q .body |
            grep -oP '^Requires: hoprnet/hopr-integration-tests#\K[0-9]+' | head -1 || true)"
          echo "pr=${tests_pr}" >>"${GITHUB_OUTPUT}"
          [ -z "${tests_pr}" ] || echo "Tests from hoprnet/hopr-integration-tests#${tests_pr}" >>"${GITHUB_STEP_SUMMARY}"
      - name: Invoke integration test
        if: steps.tail.outputs.skip != 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.bot-token.outputs.token }}
          repository: hoprnet/hopr-integration-tests
          event-type: integration
          client-payload: |-
            {
              "line": "v5",
              "project": "edge-client",
              "rev": "${{ steps.rev.outputs.head_sha }}",
              "tests_pr": "${{ steps.companion.outputs.pr }}",
              "status_context": "${{ env.STATUS_CONTEXT }}"
            }
      - name: Report the dispatch
        if: steps.tail.outputs.skip != 'true'
        env:
          REV: ${{ steps.rev.outputs.head_sha }}
        run: |
          echo "Dispatched v5 for \`${REV}\`; ${REPO} posts the \`${STATUS_CONTEXT}\` status when it finishes." >>"${GITHUB_STEP_SUMMARY}"
          echo "If this PR breaks the tests on purpose, adapt them in ${REPO} and add 'Requires: ${REPO}#<N>' on its own line to this PR's description." >>"${GITHUB_STEP_SUMMARY}"
      # Otherwise the pending status sits there until the queue's 360 min check-response timeout.
      - name: Fail the verdict if the dispatch failed
        if: failure() && steps.rev.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.rev.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=error -f context="${STATUS_CONTEXT}" \
            -f description="dispatch failed" -f target_url="${RUN_URL}"

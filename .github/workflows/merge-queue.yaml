name: Merge queue
# Dispatches hoprnet/hopr-integration-tests and blocks on its verdict, so nothing reaches `main`
# without the v5 throughput + PIX suites passing against that candidate.
#
# On pull_request the job skips unless the PR carries `run-integration`: a required check must
# report on every PR, and skipped counts as passing. The label is the opt-in pre-queue run.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      # So applying `run-integration` starts the opt-in run.
      - labeled
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: ${{ github.event.pull_request.head.ref || github.ref_name }}-merge-queue
  cancel-in-progress: true
jobs:
  integration-throughput:
    name: Integration throughput # must match the required-check context exactly
    if: >-
      (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main' && contains(github.event.pull_request.labels.*.name, 'run-integration'))
    runs-on: depot-ubuntu-24.04
    # Under the queue's own 180 min check-response timeout; the dispatched run is capped at 150.
    timeout-minutes: 170
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_HOPRNET_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_HOPRNET_BOT_PRIVATE_KEY }}
          owner: hoprnet
          repositories: hopr-integration-tests
      # The dispatch returns no run id and the API does not expose a run's payload, so the wait
      # step finds the run by this marker in its title.
      - name: Build a run marker
        id: marker
        run: echo "value=${GITHUB_REPOSITORY##*/}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >>"${GITHUB_OUTPUT}"
      # NOT `github.sha` on a pull_request: that is `refs/pull/N/merge`, and cargo mirrors only
      # heads and tags, so it cannot resolve there. A queue candidate is a head.
      - name: Resolve the rev to test
        id: rev
        env:
          MQ_SHA: ${{ github.event.merge_group.head_sha }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "head_sha=${MQ_SHA:-${PR_SHA}}" >>"${GITHUB_OUTPUT}"
      - name: Invoke integration test
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.bot-token.outputs.token }}
          repository: hoprnet/hopr-integration-tests
          event-type: integration
          client-payload: |-
            {
              "line": "v5",
              "project": "edge-client",
              "rev": "${{ steps.rev.outputs.head_sha }}",
              "marker": "${{ steps.marker.outputs.value }}"
            }
      # `repository_dispatch` is fire-and-forget: without this the job goes green as soon as the
      # event is accepted, whatever the test then does.
      - name: Wait for the integration test to conclude
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          MARKER: ${{ steps.marker.outputs.value }}
          REV: ${{ steps.rev.outputs.head_sha }}
        run: |
          set -euo pipefail
          REPO=hoprnet/hopr-integration-tests

          # The run is created even while its concurrency group holds it, so this only waits out
          # dispatch delivery, not the queue ahead of it.
          id=""
          for _ in $(seq 1 20); do
            id=$(gh run list -R "${REPO}" --workflow=integration.yaml -L 40 \
                   --json databaseId,displayTitle \
                   -q "[.[] | select(.displayTitle | contains(\"${MARKER}\")) | .databaseId] | first // empty")
            [ -n "${id}" ] && break
            sleep 15
          done
          if [ -z "${id}" ]; then
            echo "::error::dispatched for ${REV} but never found a run tagged ${MARKER};" \
                 "if the dispatch succeeded the token most likely lacks \`actions: read\`" >&2
            exit 1
          fi

          url="https://github.com/${REPO}/actions/runs/${id}"
          echo "Gating on ${url}"
          echo "Integration throughput (v5) for \`${REV}\`: ${url}" >>"${GITHUB_STEP_SUMMARY}"
          # `gh run watch` defaults to 3s, ~900 polls over a 45 min run.
          gh run watch "${id}" -R "${REPO}" --interval 30 --exit-status

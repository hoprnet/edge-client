name: PR
on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
permissions: {}
concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-pr
  cancel-in-progress: true
jobs:
  validate-pr-title:
    name: Validate title
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            build
            chore
            docs
            style
            refactor
            perf
            test
            ci
            revert
          requireScope: false
          ignoreLabels: |
            bot
            ignore-semantic-pull-request
  label:
    name: Add labels
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
      - name: Add "external" label for forked PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            gh pr edit "$PR_NUMBER" --add-label "external"
          fi
  changes:
    name: Detect changes
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      lockfile: ${{ github.event_name != 'pull_request' || steps.filter.outputs.lockfile == 'true' }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - "src/**"
              - "tests/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".cargo/**"
              - "flake.nix"
              - "flake.lock"
              - "nix/**"
              - ".github/workflows/**"
            lockfile:
              - "Cargo.toml"
              - "Cargo.lock"
              - ".cargo/audit.toml"
  validate-release-branch-deps:
    name: Release branch dependencies
    # Only PRs onto a `release/*` branch, which is where tracking a hoprnet release branch is the
    # rule. Development elsewhere has to be able to pin a rev: hoprnet does not publish `hopr-lib`,
    # so work that depends on an unreleased change has a git rev and nothing else until a release
    # branch carries it.
    if: >-
      github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/')
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every hoprnet git dependency must track a release branch
        run: |
          set -euo pipefail

          # Cargo forbids `branch` and `rev` together, so the branch lives in the
          # manifest and the resolved commit in the lock. A bare `rev` pin therefore
          # loses the branch entirely, and nothing else notices: the build still
          # succeeds against whatever commit was pinned, however stale, and the drift
          # only surfaces as behaviour that does not match the release it claims.
          fail=0

          # Manifests: any line naming the hoprnet repo must carry branch = "release/...".
          # Matched on `hoprnet/hoprnet` rather than a full URL literal, so a `.git` suffix or a
          # different scheme still counts. The lock check below is the authoritative one -- it
          # sees the resolved source however the manifest was spelled, including a multi-line
          # [dependencies.hopr-lib] table this line-based scan would miss entirely.
          while IFS= read -r line; do
            case "${line}" in
              *'branch = "release/'*) ;;
              *) echo "::error::not on a release branch: ${line}"; fail=1 ;;
            esac
          done < <(grep -nE 'git *= *"[^"]*hoprnet/hoprnet' Cargo.toml || true)

          # Lock: the resolved source must record the same, so a stale lock cannot
          # quietly outlive a corrected manifest.
          while IFS= read -r src; do
            case "${src}" in
              *'?branch=release%2F'*) ;;
              *) echo "::error::lock entry is not from a release branch: ${src}"; fail=1 ;;
            esac
          done < <(grep -o 'source = "git+https://github.com/hoprnet/hoprnet[^"]*"' Cargo.lock | sort -u || true)

          if [ "${fail}" -ne 0 ]; then
            echo "::error::hoprnet dependencies must use branch = \"release/<x.y>\"; a bare rev pin is not accepted"
            exit 1
          fi

          echo "All hoprnet git dependencies track a release branch:"
          grep -n 'git = "https://github.com/hoprnet/hoprnet"' Cargo.toml || true
          grep -o 'source = "git+https://github.com/hoprnet/hoprnet[^"]*"' Cargo.lock | sort -u || true
  checks:
    name: Check
    # In the merge queue we don't want to re-run the heavy checks, but their
    # contexts (`Check / *`) are required and must report on the merge group or
    # the queue stalls. So the job still runs on merge_group; the reusable
    # workflow's `enable`/skip booleans are turned off there, which skips the work
    # while each `Check / *` still reports (green). Only Integration throughput
    # does real work in the queue (see merge-queue.yaml). `!= 'merge_group'` keeps
    # format and pre_commit on for every PR; lint and audit are also gated on the
    # `changes` path filter (rust, lockfile).
    needs: changes
    uses: hoprnet/hopr-workflows/.github/workflows/checks.yaml@d0cffaf9e9209c8eca00e8c74e82ac3f5f3cf7bb # workflow-checks-v2
    permissions:
      contents: read
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      format: ${{ github.event_name != 'merge_group' }}
      pre_commit: ${{ github.event_name != 'merge_group' }}
      lint: ${{ github.event_name != 'merge_group' && needs.changes.outputs.rust == 'true' }}
      audit: ${{ github.event_name != 'merge_group' && needs.changes.outputs.lockfile == 'true' }}
      lint_command: "nix build -L .#checks.x86_64-linux.clippy"
      deps: false
      audit_command: "nix run -L .#audit"
      runner_small: depot-ubuntu-24.04
      runner_large: depot-ubuntu-24.04-8
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  tests:
    name: Test
    # Runs on merge_group too, but the enable booleans are off there so the
    # `Test / *` contexts report (skipped = passing) without re-running (see `checks`).
    needs: [changes, checks]
    if: ${{ !cancelled() && !failure() }}
    uses: hoprnet/hopr-workflows/.github/workflows/tests.yaml@798d791de5c5485c3043049781dfd0938539a36a # workflow-tests-v6
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload in the coverage job
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      enable_unit_tests: ${{ github.event_name != 'merge_group' && needs.changes.outputs.rust == 'true' }}
      unit_test_command: "nix develop -c cargo nextest run --no-tests=pass"
      enable_unit_coverage: ${{ github.event_name != 'merge_group' && needs.changes.outputs.rust == 'true' }}
      unit_coverage_command: "nix run .#coverage-unit"
      runner_unit: depot-ubuntu-24.04-8
      test_timeout: 30
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  build-library:
    name: Library ${{ matrix.architecture }}
    # Runs on merge_group too; `enabled` is off there so `Library … / Build`
    # reports (skipped = passing) without rebuilding (see `checks`).
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64-linux
            runner: depot-ubuntu-24.04-8
            build_command: nix build -L .#lib-edgli-x86_64-linux
            required_label: ""
          - architecture: aarch64-linux
            runner: depot-ubuntu-24.04-8
            build_command: nix build -L .#lib-edgli-aarch64-linux
            required_label: "binary:aarch64-linux"
          - architecture: aarch64-darwin
            runner: macos-15-xlarge
            build_command: nix build -L .#lib-edgli-aarch64-darwin
            required_label: binary:aarch64-darwin
    needs: [changes, checks, tests]
    if: ${{ !cancelled() && !failure() }}
    uses: hoprnet/hopr-workflows/.github/workflows/build-library.yaml@5ef5e50e028143b53da6545c1ca92477b70f42fc # build-library-v1
    permissions:
      contents: read
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      architecture: ${{ matrix.architecture }}
      build_command: ${{ matrix.build_command }}
      runner: ${{ matrix.runner }}
      enabled: ${{ github.event_name != 'merge_group' && needs.changes.outputs.rust == 'true' && (matrix.required_label == '' || contains(github.event.pull_request.labels.*.name, matrix.required_label)) }}
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  # Single aggregate merge gate: green only if every other job in this run
  # succeeded. Mark THIS one as the required check in the branch ruleset, so
  # adding, renaming, or removing a job never needs a ruleset change.
  # `if: always()` runs it even when a dependency fails; alls-green then reds
  # the gate on any non-success (a failed job, or a skip that is not allowed).
  # Exception: `label` is best-effort (continue-on-error), so its failure is ignored.
  merge-gate:
    name: Merge gate
    if: always()
    needs:
      - changes
      - validate-pr-title
      - label
      - validate-release-branch-deps
      - checks
      - tests
      - build-library
    runs-on: depot-ubuntu-24.04
    permissions: {}
    steps:
      - name: Require all jobs to pass
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          # validate-pr-title and label run on pull_request only, and
          # validate-release-branch-deps only for PRs onto release/*. In the
          # merge queue every enable input of checks, tests and build-library is
          # off. checks stays green there (its reusable matrix job has no
          # job-level `if`, only its steps skip); tests and build-library report
          # skipped. On a pull_request, tests and build-library may skip only when
          # the path filter finds no Rust change; checks always runs format and
          # pre-commit. A failed job reds the gate either way (except `label`,
          # which is best-effort and ignored), and so does a skipped later stage
          # after a failure.
          allowed-skips: ${{ github.event_name == 'merge_group' && 'validate-pr-title, label, validate-release-branch-deps, checks, tests, build-library' || (needs.changes.outputs.rust == 'true' && 'validate-pr-title, label, validate-release-branch-deps' || 'validate-pr-title, label, validate-release-branch-deps, tests, build-library') }}

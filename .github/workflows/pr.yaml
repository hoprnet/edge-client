name: PR
on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      # So applying `run-integration` starts the opt-in integration job below.
      - labeled
permissions:
  contents: read
  id-token: write # zizmor: ignore[excessive-permissions]
concurrency:
  group: ${{ github.event.pull_request.head.ref || github.ref_name }}-pr
  cancel-in-progress: true
jobs:
  validate-pr-title:
    name: Validate title
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            build
            chore
            docs
            style
            refactor
            perf
            test
          requireScope: false
          ignoreLabels: |
            bot
            ignore-semantic-pull-request
  label:
    name: Add labels
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/labeler@77a4082b841706ac431479b7e2bb11216ffef250 # main on 20.02.2025
        with:
          sync-labels: true
      - name: Add "external" label for forked PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            gh pr edit "$PR_NUMBER" --add-label "external"
          fi
  validate-release-branch-deps:
    name: Release branch dependencies
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every hoprnet git dependency must track a release branch
        run: |
          set -euo pipefail

          # Cargo forbids `branch` and `rev` together, so the branch lives in the
          # manifest and the resolved commit in the lock. A bare `rev` pin therefore
          # loses the branch entirely, and nothing else notices: the build still
          # succeeds against whatever commit was pinned, however stale, and the drift
          # only surfaces as behaviour that does not match the release it claims.
          fail=0

          # Manifests: any line naming the hoprnet repo must carry branch = "release/...".
          # Matched on `hoprnet/hoprnet` rather than a full URL literal, so a `.git` suffix or a
          # different scheme still counts. The lock check below is the authoritative one -- it
          # sees the resolved source however the manifest was spelled, including a multi-line
          # [dependencies.hopr-lib] table this line-based scan would miss entirely.
          while IFS= read -r line; do
            case "${line}" in
              *'branch = "release/'*) ;;
              *) echo "::error::not on a release branch: ${line}"; fail=1 ;;
            esac
          done < <(grep -nE 'git *= *"[^"]*hoprnet/hoprnet' Cargo.toml || true)

          # Lock: the resolved source must record the same, so a stale lock cannot
          # quietly outlive a corrected manifest.
          while IFS= read -r src; do
            case "${src}" in
              *'?branch=release%2F'*) ;;
              *) echo "::error::lock entry is not from a release branch: ${src}"; fail=1 ;;
            esac
          done < <(grep -o 'source = "git+https://github.com/hoprnet/hoprnet[^"]*"' Cargo.lock | sort -u || true)

          if [ "${fail}" -ne 0 ]; then
            echo "::error::hoprnet dependencies must use branch = \"release/<x.y>\"; a bare rev pin is not accepted"
            exit 1
          fi

          echo "All hoprnet git dependencies track a release branch:"
          grep -n 'git = "https://github.com/hoprnet/hoprnet"' Cargo.toml || true
          grep -o 'source = "git+https://github.com/hoprnet/hoprnet[^"]*"' Cargo.lock | sort -u || true
  checks:
    name: Check
    uses: hoprnet/hopr-workflows/.github/workflows/checks.yaml@d0cffaf9e9209c8eca00e8c74e82ac3f5f3cf7bb # workflow-checks-v2
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      lint_command: "nix build -L .#checks.x86_64-linux.clippy"
      deps: false
      audit_command: "nix build -L .#checks.x86_64-linux.audit"
      runner_small: depot-ubuntu-24.04
      runner_large: depot-ubuntu-24.04-8
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  tests:
    name: Test
    uses: hoprnet/hopr-workflows/.github/workflows/tests.yaml@798d791de5c5485c3043049781dfd0938539a36a # workflow-tests-v6
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      enable_unit_tests: true
      unit_test_command: "nix develop -c cargo nextest run --no-tests=pass"
      enable_unit_coverage: true
      unit_coverage_command: "nix run .#coverage-unit"
      runner_unit: depot-ubuntu-24.04-8
      test_timeout: 30
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  build-library:
    name: Library ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64-linux
            runner: depot-ubuntu-24.04-8
            build_command: nix build -L .#lib-edgli-x86_64-linux
            required_label: ""
          - architecture: aarch64-linux
            runner: depot-ubuntu-24.04-8
            build_command: nix build -L .#lib-edgli-aarch64-linux
            required_label: "binary:aarch64-linux"
          - architecture: aarch64-darwin
            runner: macos-15-xlarge
            build_command: nix build -L .#lib-edgli-aarch64-darwin
            required_label: binary:aarch64-darwin
    uses: hoprnet/hopr-workflows/.github/workflows/build-library.yaml@5ef5e50e028143b53da6545c1ca92477b70f42fc # build-library-v1
    permissions:
      contents: read
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      architecture: ${{ matrix.architecture }}
      build_command: ${{ matrix.build_command }}
      runner: ${{ matrix.runner }}
      enabled: ${{ matrix.required_label == '' || contains(github.event.pull_request.labels.*.name, matrix.required_label) }}
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  integration-throughput:
    name: Integration throughput
    # Gates the merge queue; the label is an opt-in pre-queue run. Restricted to `release/4.1`: `main` repinned hopr-lib to hoprnet
    # `master` (v5) in #151, and hopr-integration-tests only supports the v4 line.
    if: >-
      (github.event_name == 'merge_group'
        && github.event.merge_group.base_ref == 'refs/heads/release/4.1')
      || (github.event_name == 'pull_request'
        && contains(github.event.pull_request.labels.*.name, 'run-integration'))
    runs-on: depot-ubuntu-24.04
    # Must outlast the dispatched run (~45 min, capped there at 150).
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_HOPRNET_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_HOPRNET_BOT_PRIVATE_KEY }}
          owner: hoprnet
          repositories: hopr-integration-tests
      # hopr-integration-tests echoes this into its run name; it is how the wait step
      # finds our run, since `repository_dispatch` returns nothing identifying.
      - name: Build a run marker
        id: marker
        run: echo "value=${GITHUB_REPOSITORY##*/}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
      # rev: on merge_group `github.sha` is the queue candidate; on pull_request it is
      # the test-merge commit. Both are "PR merged into base", which is the point.
      - name: Invoke integration test
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.bot-token.outputs.token }}
          repository: hoprnet/hopr-integration-tests
          event-type: integration
          client-payload: |-
            {
              "project": "edge-client",
              "rev": "${{ github.sha }}",
              "marker": "${{ steps.marker.outputs.value }}"
            }
      # `repository_dispatch` is fire-and-forget, so without this the job goes green
      # as soon as the event is accepted, whatever the test does.
      - name: Wait for the integration test to conclude
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          MARKER: ${{ steps.marker.outputs.value }}
        run: |
          set -euo pipefail
          REPO=hoprnet/hopr-integration-tests
          # 5 min window: the run can sit queued behind that repo's concurrency group.
          id=""
          for _ in $(seq 1 20); do
            id=$(gh run list -R "$REPO" --workflow=integration.yaml -L 40 \
                   --json databaseId,displayTitle \
                   -q "[.[] | select(.displayTitle | contains(\"$MARKER\")) | .databaseId] | first // empty")
            [ -n "$id" ] && break
            sleep 15
          done
          if [ -z "$id" ]; then
            echo "::error::dispatched the integration test but never found a run tagged $MARKER" >&2
            exit 1
          fi

          echo "Gating on https://github.com/$REPO/actions/runs/$id"
          # --interval: `gh run watch` defaults to 3s, ~700 polls over a 40 min run.
          gh run watch "$id" -R "$REPO" --interval 30 --exit-status

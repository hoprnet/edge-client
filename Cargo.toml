[package]
name = "edgli"
version = "5.0.0"
authors = ["HOPR Association <tech@hoprnet.org>"]
edition = "2024"
description = "Light client implementing the minimum HOPR protocol to serve as an entry node into the mixnet."
homepage = "https://hoprnet.org/"
repository = "https://github.com/hoprnet/edge-client"
license = "GPL-3.0-only"

# Declared explicitly (instead of relying on src/main.rs auto-discovery) so that
# feature-specific builds (`--no-default-features`) skip the binary instead of
# failing to compile it: the binary drives the concrete `Edgli` client, which
# requires both a runtime and the blokli connector.
[[bin]]
name = "edgli"
path = "src/main.rs"
required-features = ["runtime-tokio", "blokli"]

[features]
default = ["runtime-tokio", "blokli"]
runtime-tokio = [
  "dep:tokio",
  "hopr-lib/runtime-tokio",
  "hopr-transport-p2p/runtime-tokio",
  "hopr-transport-p2p/transport-quic",
]
# Enable hopr-lib telemetry (Prometheus metrics) and OpenTelemetry OTLP exporter
telemetry = [
  "hopr-lib/telemetry",
  "dep:opentelemetry",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry_sdk",
  # "dep:tracing-opentelemetry",
]
testing = ["hopr-lib/testing"]
blokli = ["dep:tokio", "dep:url"]

# PIX: pay the Exit for the traffic it delivers, by depositing wxHOPR to a per-Session stealth
# address whose key the Exit reconstructs from the SSA shares its spent SURBs carried.
#
# Selects the secp256k1 (non-anonymous) deposit pool, which settles to Ethereum deposit addresses a
# plain `HoprToken.transfer` can reach. It is the only pool upstream implements — `CurvyDepositPool`
# is a stub whose methods panic — and its operations are fully visible on-chain, which is why
# upstream marks it **not for production**. Off by default for that reason. A Baby JubJub pool
# would arrive as a sibling `pix-curvy`, not as a change of meaning here.
#
# `hopr-lib/pix-secp256k1` is stated positively rather than left to `default-features = false`:
# `pix-bjj` is hopr-lib's default, features are additive, and any crate in the graph pulling
# hopr-lib with defaults brings it back silently. `pix-secp256k1` is written upstream to win on
# addition precisely so it cannot be undone that way.
#
# Pulls `runtime-tokio` because the PIX strategy needs the tokio runtime; a build with the pool but
# no runtime would compile to a client that silently has no PIX.
pix-secp256k1 = [
  "runtime-tokio",
  "dep:validator",
  "hopr-lib/pix-secp256k1",
  "hopr-strategy/strategy-pix-secp256k1",
]

# tokio-console profiling of the `edgli` binary (see init_logger in src/main.rs). Build with
# the `tracer` profile so TRACE-level task spans stay compiled in (see [profile.tracer]):
#   cargo build --profile tracer --features prof
# `.cargo/config.toml` already supplies `--cfg tokio_unstable`; do not set RUSTFLAGS.
prof = ["dep:console-subscriber"]

[dependencies]
anyhow = "1.0.104"
bytesize = "2.7.0"
smart-default = "0.7.1"
async-signal = "0.2.14"
async-trait = "0.1.91"
cfg-if = "1.0.4"
clap = { version = "4.6.5", features = ["derive", "env", "string"] }
console-subscriber = { version = "0.5.0", optional = true }
futures = "0.3.33"
multiaddr = "0.18.2"
lazy_static = "1.5.0"
signal-hook = "0.4.4"
serde_yaml = { version = "0.9.34" }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "tracing",
], optional = true }
tracing = { version = "0.1.44", features = ["release_max_level_debug"] }
tracing-subscriber = { version = "0.3.23", features = [
  "fmt",
  "json",
  "env-filter",
] }
opentelemetry = { version = "0.32.0", optional = true }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = [
  "trace",
  "reqwest-client",
  "tls-roots",
  "http-proto",
  "grpc-tonic",
], optional = true }
opentelemetry_sdk = { version = "0.32.1", optional = true }
# tracing-opentelemetry = { version = "0.32.0", optional = true }
url = { version = "2.5.8", optional = true }
# Only to call `Validate::validate` on the node's own PIX configuration before deriving a quota
# from it, the way `hopr-transport` validates it before building the generator. Already unified at
# this version across the graph (hopr-lib, hopr-transport, hopr-strategy and four more), so the
# direct dependency adds nothing to compile.
validator = { version = "0.21.0", optional = true }

# Pinned to a `rev` rather than tracked on `release/4.0`, because PIX lives only on `master`
# (as #8095) and that branch has none of it — not the protocol crate, not the transport wiring,
# not `HoprSessionClientConfig::pix_ssa_quota`.
#
# The rev is the one `hoprd` pins, so the two clients that have to interoperate link the same
# hopr-lib rather than two commits that merely look alike.
#
# Moving off `release/4.0` costs nothing: `git cherry` reports four release-only fixes (#8337,
# #8346, #8348, #8350) as absent from `master`, but that is patch-id noise from the `Cargo.lock`
# the PIX squash rewrote. Every source file those four touch is byte-identical between the two
# trees, so `master` is a content superset.
#
# A `branch` ref would be the wrong replacement anyway: `master` moves, and every unrelated commit
# on it would arrive here silently between one `cargo update` and the next.
hopr-lib = { git = "https://github.com/hoprnet/hoprnet", rev = "7b46149bc32f0cdca76fd84e52c598b881c7d643", features = [
  "session-client",
  "serde",
] }
hopr-chain-connector = { version = "0.22.2", features = ["runtime-tokio"] }
hopr-ct-full-network = { version = "0.4.0" }
# 1.0.2 for the `pix` module, which 0.28.0 does not have. Nothing else about the bump reaches this
# crate: `channel_lifecycle` — the only module used here — is byte-identical between the two
# releases, and the rest of the delta is the additive `pix` module.
hopr-strategy = { version = "1.0.2", features = ["strategy-channel-lifecycle"] }
hopr-ticket-manager = { version = "0.5.2" }
hopr-network-graph = { version = "0.5.0" }
hopr-transport-p2p = { version = "0.9.5" }

# Target-specific dependencies for memory allocators
[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { version = "0.1.52", default-features = false, features = [
  "secure",
] }

[dev-dependencies]
# `testing` provides the blokli test emulator used by the src/blokli.rs unit tests.
hopr-chain-connector = { version = "0.22.2", features = [
  "runtime-tokio",
  "testing",
] }
# `full` for the async unit tests in src/ (#[tokio::test], spawn, time, sync).
tokio = { version = "1.53.1", features = ["full"] }

[build-dependencies]
anyhow = "1.0.104"

# tokio-console build target for the `prof` binary. hopr-lib forces
# `tracing/release_max_level_debug`, which compiles out TRACE callsites (incl. tokio's task
# instrumentation) in release. That cap only fires under `cfg(not(debug_assertions))`, so
# turning debug-asserts back on makes it inert and STATIC_MAX_LEVEL falls through to TRACE —
# tokio-console then sees the task spans. Optimizations stay on (release) so the profiled run
# reflects real timings. Build with:
#   cargo build --profile tracer --features prof
[profile.tracer]
inherits = "release"
debug-assertions = true

[package]
name = "edgli"
version = "3.4.0"
authors = ["HOPR Association <tech@hoprnet.org>"]
edition = "2024"
description = "Light client implementing the minimum HOPR protocol to serve as an entry node into the mixnet."
homepage = "https://hoprnet.org/"
repository = "https://github.com/hoprnet/edge-client"
license = "GPL-3.0-only"

# Declared explicitly (instead of relying on src/main.rs auto-discovery) so that
# feature-specific builds (`--no-default-features`) skip the binary instead of
# failing to compile it: the binary drives the concrete `Edgli` client, which
# requires both a runtime and the blokli connector.
[[bin]]
name = "edgli"
path = "src/main.rs"
required-features = ["runtime-tokio", "blokli"]

# The session end-to-end tests exercise the concrete `Edgli` client through the
# shared harness in tests/common, so they need the same features as the binary.
[[test]]
name = "edgli_session_e2e"
required-features = ["runtime-tokio", "blokli"]

[[test]]
name = "edgli_session_rotsee"
required-features = ["runtime-tokio", "blokli"]

[features]
default = ["runtime-tokio", "blokli"]
runtime-tokio = [
  "dep:tokio",
  "hopr-lib/runtime-tokio",
  "hopr-transport-p2p/runtime-tokio",
  "hopr-transport-p2p/transport-quic",
]
# Enable hopr-lib telemetry (Prometheus metrics) and OpenTelemetry OTLP exporter
telemetry = [
  "hopr-lib/telemetry",
  "dep:opentelemetry",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry_sdk",
  # "dep:tracing-opentelemetry",
]
testing = ["hopr-lib/testing"]
blokli = ["dep:tokio", "dep:url"]

# To use profiling:
# 1. Set RUSTFLAGS="--cfg tokio_unstable" before building
# 2. Enable the 'prof' feature: cargo build --feature prof
prof = [
  "dep:console-subscriber",
] # must be built with 'tokio_unstable': https://github.com/tokio-rs/console/tree/main/console-subscriber

[dependencies]
anyhow = "1.0.103"
bytesize = "2.4.2"
smart-default = "0.7.1"
async-signal = "0.2.14"
async-trait = "0.1.89"
cfg-if = "1.0.4"
clap = { version = "4.6.1", features = ["derive", "env", "string"] }
console-subscriber = { version = "0.5.0", optional = true }
futures = "0.3.32"
multiaddr = "0.18.2"
lazy_static = "1.5.0"
signal-hook = "0.4.4"
serde_yaml = { version = "0.9.34" }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = [
  "rt-multi-thread",
  "macros",
  "tracing",
], optional = true }
tracing = { version = "0.1.44", features = ["release_max_level_debug"] }
tracing-subscriber = { version = "0.3.23", features = [
  "fmt",
  "json",
  "env-filter",
] }
opentelemetry = { version = "0.32.0", optional = true }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = [
  "trace",
  "reqwest-client",
  "tls-roots",
  "http-proto",
  "grpc-tonic",
], optional = true }
opentelemetry_sdk = { version = "0.32.1", optional = true }
# tracing-opentelemetry = { version = "0.32.0", optional = true }
url = { version = "2.5.8", optional = true }

hopr-lib = { git = "https://github.com/hoprnet/hoprnet", rev = "837f8d933c1ba78cda1ffe42bd37d13e7a9f0929", features = [
  "session-client",
  "serde",
] }
hopr-chain-connector = { git = "https://github.com/hoprnet/hoprnet", rev = "837f8d933c1ba78cda1ffe42bd37d13e7a9f0929", features = [
  "runtime-tokio",
] }
hopr-ct-full-network = { git = "https://github.com/hoprnet/hoprnet", rev = "837f8d933c1ba78cda1ffe42bd37d13e7a9f0929" }
hopr-strategy = { version = "0.22.0", features = [
  "strategy-channel-lifecycle",
] }
hopr-ticket-manager = { git = "https://github.com/hoprnet/hoprnet", rev = "837f8d933c1ba78cda1ffe42bd37d13e7a9f0929" }
hopr-network-graph = { git = "https://github.com/hoprnet/hoprnet", rev = "837f8d933c1ba78cda1ffe42bd37d13e7a9f0929" }
hopr-transport-p2p = { git = "https://github.com/hoprnet/hoprnet", rev = "837f8d933c1ba78cda1ffe42bd37d13e7a9f0929" }

# Target-specific dependencies for memory allocators
[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { version = "0.1.52", default-features = false, features = [
  "secure",
] }

[dev-dependencies]
hopr-chain-connector = { git = "https://github.com/hoprnet/hoprnet", rev = "837f8d933c1ba78cda1ffe42bd37d13e7a9f0929", features = [
  "runtime-tokio",
  "testing",
] }
tokio = { version = "1.52.3", features = ["full", "process"] }
reqwest = { version = "0.13.4", default-features = false, features = [
  "rustls",
  "json",
] }
tempfile = "3.27.0"
sha2 = "0.11.0"
nix = { version = "0.31.3", features = ["signal"] }
rand = "0.10.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
test-log = { version = "0.2.21", features = ["trace"] }

[build-dependencies]
anyhow = "1.0.103"

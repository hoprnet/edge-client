[package]
name = "edgli"
version = "3.5.0"
authors = ["HOPR Association <tech@hoprnet.org>"]
edition = "2024"
description = "Light client implementing the minimum HOPR protocol to serve as an entry node into the mixnet."
homepage = "https://hoprnet.org/"
repository = "https://github.com/hoprnet/edge-client"
license = "GPL-3.0-only"

# Declared explicitly (instead of relying on src/main.rs auto-discovery) so that
# feature-specific builds (`--no-default-features`) skip the binary instead of
# failing to compile it: the binary drives the concrete `Edgli` client, which
# requires both a runtime and the blokli connector.
[[bin]]
name = "edgli"
path = "src/main.rs"
required-features = ["runtime-tokio", "blokli"]

# The session end-to-end tests exercise the concrete `Edgli` client through the
# shared harness in tests/common, so they need the same features as the binary.
[[test]]
name = "edgli_session_e2e"
required-features = ["runtime-tokio", "blokli"]

[[test]]
name = "edgli_session_rotsee"
required-features = ["runtime-tokio", "blokli"]

[features]
default = ["runtime-tokio", "blokli"]
runtime-tokio = [
  "dep:tokio",
  "hopr-lib/runtime-tokio",
  "hopr-transport-p2p/runtime-tokio",
  "hopr-transport-p2p/transport-quic",
]
# Enable hopr-lib telemetry (Prometheus metrics) and OpenTelemetry OTLP exporter
telemetry = [
  "hopr-lib/telemetry",
  "dep:opentelemetry",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry_sdk",
  # "dep:tracing-opentelemetry",
]
testing = ["hopr-lib/testing"]
blokli = ["dep:tokio", "dep:url"]

# tokio-console profiling. Build with the `tracer` profile so TRACE-level task
# spans stay compiled in (see [profile.tracer] below):
#   RUSTFLAGS="--cfg tokio_unstable" cargo build --profile tracer --features prof
prof = [
  "dep:console-subscriber",
] # must be built with 'tokio_unstable': https://github.com/tokio-rs/console/tree/main/console-subscriber

[dependencies]
anyhow = "1.0.104"
bytesize = "2.7.0"
smart-default = "0.7.1"
async-signal = "0.2.14"
async-trait = "0.1.91"
cfg-if = "1.0.4"
clap = { version = "4.6.5", features = ["derive", "env", "string"] }
console-subscriber = { version = "0.5.0", optional = true }
futures = "0.3.33"
multiaddr = "0.18.2"
lazy_static = "1.5.0"
signal-hook = "0.4.4"
serde_yaml = { version = "0.9.34" }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "tracing",
], optional = true }
tracing = { version = "0.1.44", features = ["release_max_level_debug"] }
tracing-subscriber = { version = "0.3.23", features = [
  "fmt",
  "json",
  "env-filter",
] }
opentelemetry = { version = "0.32.0", optional = true }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = [
  "trace",
  "reqwest-client",
  "tls-roots",
  "http-proto",
  "grpc-tonic",
], optional = true }
opentelemetry_sdk = { version = "0.32.1", optional = true }
# tracing-opentelemetry = { version = "0.32.0", optional = true }
url = { version = "2.5.8", optional = true }

hopr-lib = { git = "https://github.com/hoprnet/hoprnet", rev = "a511b8a88b297f47a15986573bf6db3ef7b95937", features = [
  "session-client",
  "serde",
] }
hopr-chain-connector = { git = "https://github.com/hoprnet/hoprnet", rev = "a511b8a88b297f47a15986573bf6db3ef7b95937", features = [
  "runtime-tokio",
] }
hopr-ct-full-network = { git = "https://github.com/hoprnet/hoprnet", rev = "a511b8a88b297f47a15986573bf6db3ef7b95937" }
hopr-strategy = { version = "0.22.0", features = [
  "strategy-channel-lifecycle",
] }
hopr-ticket-manager = { git = "https://github.com/hoprnet/hoprnet", rev = "a511b8a88b297f47a15986573bf6db3ef7b95937" }
hopr-network-graph = { git = "https://github.com/hoprnet/hoprnet", rev = "a511b8a88b297f47a15986573bf6db3ef7b95937" }
hopr-transport-p2p = { git = "https://github.com/hoprnet/hoprnet", rev = "a511b8a88b297f47a15986573bf6db3ef7b95937" }

# Target-specific dependencies for memory allocators
[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { version = "0.1.52", default-features = false, features = [
  "secure",
] }

[dev-dependencies]
hopr-chain-connector = { git = "https://github.com/hoprnet/hoprnet", rev = "a511b8a88b297f47a15986573bf6db3ef7b95937", features = [
  "runtime-tokio",
  "testing",
] }
tokio = { version = "1.53.1", features = ["full", "process", "tracing"] }
# Optional flamegraph layer for the session e2e harness (env-gated: FLAME_OUTPUT).
# `tracing-chrome` (Chrome/Perfetto layer) is already declared below.
tracing-flame = "0.2.0"
reqwest = { version = "0.13.4", default-features = false, features = [
  "rustls",
  "json",
] }
tempfile = "3.27.0"
sha2 = "0.11.0"
nix = { version = "0.31.3", features = ["signal"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing-chrome = "0.7.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
test-log = { version = "0.2.21", features = ["trace"] }

[build-dependencies]
anyhow = "1.0.104"

# tokio-console build target. hopr-lib forces `tracing/release_max_level_debug`,
# which compiles out TRACE callsites (incl. tokio's task instrumentation) in
# release. That cap only fires under `cfg(not(debug_assertions))`, so turning
# debug-asserts back on makes it inert and STATIC_MAX_LEVEL falls through to
# TRACE — tokio-console then sees the task spans. Optimizations stay on (release)
# so the profiled run reflects real timings. Build with:
#   RUSTFLAGS="--cfg tokio_unstable" cargo build --profile tracer --features prof
[profile.tracer]
inherits = "release"
debug-assertions = true

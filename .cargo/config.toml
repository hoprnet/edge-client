[install]
root = ".cargo"

[env]
# Jemalloc runtime configuration parameters
# See: http://jemalloc.net/jemalloc.3.html#opt.abort_conf
# abort_conf:true        - Abort on configuration errors (safer for production to fail early)
# narenas:4              - Use 4 arenas (memory allocation regions) for reduced contention
# tcache_max:65536       - Max size (64KB) for thread-local cache allocations
# dirty_decay_ms:3000    - Release dirty pages after 3 seconds of inactivity
# muzzy_decay_ms:6000    - Release muzzy pages after 6 seconds (more aggressive cleanup)
# background_thread:true - Enable background thread for maintenance tasks
# metadata_thp:auto      - Auto-detect transparent huge pages for metadata
JEMALLOC_SYS_WITH_MALLOC_CONF = "abort_conf:true,narenas:4,tcache_max:65536,dirty_decay_ms:3000,muzzy_decay_ms:6000,background_thread:true,metadata_thp:auto"

# C/C++ compiler flags for optimized builds and jemalloc working
# -O3: Maximum optimization level for best performance
# -ffunction-sections/-fdata-sections: Enable dead code elimination
# -fPIC: Generate position-independent code for shared libraries
CFLAGS = "-O3 -ffunction-sections -fdata-sections -fPIC"
CPPFLAGS = "-O3 -ffunction-sections -fdata-sections -fPIC"
LDFLAGS = "-O3 -ffunction-sections -fdata-sections -fPIC"

# Build with `--cfg tokio_unstable` so the hoprnet crates (hopr-utilities and
# the transport/session stack) get Tokio's improved cooperative yielding. Cargo
# does NOT merge `[build]` and target-specific rustflags — the matching target
# table wins outright — so the flag is repeated in the aarch64 table below as
# well as `[build]`. `--check-cfg` keeps `-D warnings` clean.
#
# NOTE: The `RUSTFLAGS` environment variable *replaces* these tables wholesale —
# it does not append. Exporting `RUSTFLAGS="--cfg tokio_unstable"` would therefore
# silently drop `-Ctarget-feature=+aes,+neon` and `--cfg=aes_armv8` on
# aarch64-apple-darwin. Since this file already supplies `--cfg tokio_unstable`
# unconditionally, do NOT set `RUSTFLAGS` for builds here.
[build]
rustflags = ["--cfg", "tokio_unstable", "--check-cfg", "cfg(tokio_unstable)"]

# Enable hardware AES intrinsics on aarch64 — selects aes::armv8 backend at
# compile time instead of the runtime-dispatched aes::soft::fixslice path.
# Benchmarks show ~10× key-schedule improvement on Apple Silicon.
# See: hoprnet/edge-client#82
[target.aarch64-apple-darwin]
rustflags = [
  "--cfg=aes_armv8",
  "-Ctarget-feature=+aes,+neon",
  "--cfg",
  "tokio_unstable",
  "--check-cfg",
  "cfg(tokio_unstable)",
]

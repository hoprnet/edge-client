[advisories]
ignore = [
  "RUSTSEC-2024-0436", # 'paste' dependency in 'libp2p' [unmaintained]
  "RUSTSEC-2024-0388", # 'derivative' in 'alloy' [unmaintained],
  "RUSTSEC-2026-0118", # `hickory-proto` 0.25.2 - no fix available yet, transitive from hoprnet
  "RUSTSEC-2026-0119", # `hickory-proto` CPU exhaustion, needs >=0.26.1, transitive from hoprnet
  "RUSTSEC-2026-0173", # `proc-macro-error2` [unmaintained], transitive dep via validator_derive
  "RUSTSEC-2024-0449", # `unsafe-libyaml` [unmaintained] via `serde_yaml`, no maintained drop-in without a code change
  "RUSTSEC-2026-0249", # `smartstring` [unmaintained], no patched version
  "RUSTSEC-2026-0387", # `crypto-bigint` 0.5.5 timing variability; elliptic-curve 0.13.8 -> k256 0.13.4 (alloy signer stack); fix needs elliptic-curve/k256 0.14, blocked on an alloy bump
]
informational_warnings = ["unmaintained"]
severity_threshold = "low"

[database]
path = "~/.cargo/advisory-db"
url = "https://github.com/RustSec/advisory-db.git"
fetch = true
stale = false

[output]
deny = ["warnings"]
format = "terminal" # "terminal" (human readable report) or "json"
quiet = false       # Only print information on error
show_tree = true    # Show inverse dependency trees along with advisories (default: true)

[target]
arch = [
  "x86_64",
  "aarch64",
] # Ignore advisories for CPU architectures other than these
os = [
  "linux",
  "windows",
  "macos",
] # Ignore advisories for operating systems other than these

[yanked]
enabled = true      # Warn for yanked crates in Cargo.lock (default: true)
update_index = true # Auto-update the crates.io index (default: true)
